<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Pay Mall 商城 - 立即下单</title>
    <style>
        :root {
            --brand: #e02e24;
            --brand-dark: #c8231a;
            --brand-light: #ff5a4e;
            --orange: #ff7a00;
            --yellow-bg: #fff8e6;
            --yellow-line: #ffd591;
            --text: #222222;
            --text-sub: #888888;
            --line: #eeeeee;
            --bg: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0 0 92px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 顶部品牌栏 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            background: linear-gradient(135deg, var(--brand-light), var(--brand));
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(224, 46, 36, 0.25);
        }

        .app-header .logo-dot {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.22);
            font-size: 15px;
        }

        .app-header .sub {
            margin-left: auto;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }

        .page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 12px;
        }

        /* 内容纵向排列，卡片之间统一 12px 间距 */
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 商品卡片 */
        .product-info {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        .thumb {
            position: relative;
            flex: 0 0 116px;
            width: 116px;
            height: 116px;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
            border: 1px solid var(--line);
        }

        .thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff1f0, #ffe7d6);
            font-size: 40px;
        }

        .product-meta {
            flex: 1;
            min-width: 0;
        }

        .product-title {
            margin: 0 0 8px;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag {
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--brand);
            background: #fff1f0;
            border: 1px solid #ffccc7;
        }

        .tag-light {
            color: var(--orange);
            background: var(--yellow-bg);
            border-color: var(--yellow-line);
        }

        .price-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .price {
            color: var(--brand);
            font-size: 26px;
            font-weight: 800;
            font-family: "DIN Alternate", -apple-system, "Helvetica Neue", Arial, sans-serif;
            line-height: 1;
        }

        .price i {
            font-style: normal;
            font-size: 14px;
            font-weight: 700;
            margin-right: 1px;
        }

        .price-origin {
            color: var(--text-sub);
            font-size: 12px;
            text-decoration: line-through;
        }

        .sold {
            margin-left: auto;
            color: var(--text-sub);
            font-size: 12px;
        }

        /* 优惠 / 服务保障条 */
        .benefit {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--yellow-bg);
            border: 1px dashed var(--yellow-line);
            border-radius: 12px;
            font-size: 12px;
            color: #a86b00;
        }

        .benefit .benefit-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .benefit .benefit-item::before {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--orange);
        }

        /* 账号提示 */
        .account-info {
            display: block;
            padding: 12px;
            background: #fff;
            border-radius: 14px;
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.8;
            word-break: break-all;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        .account-info strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text);
            font-size: 13px;
        }

        .error-tip {
            display: none;
            padding: 10px 12px;
            background: #fff1f0;
            border: 1px solid #ffccc7;
            border-radius: 12px;
            color: var(--brand);
            font-size: 12px;
        }

        /* 底部下单栏 */
        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-top: 1px solid var(--line);
        }

        .order-button {
            width: 100%;
            max-width: 536px;
            padding: 13px 16px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--brand-light), var(--brand) 60%, var(--brand-dark));
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(224, 46, 36, 0.32);
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
        }

        .order-button:hover {
            box-shadow: 0 8px 18px rgba(224, 46, 36, 0.4);
        }

        .order-button:active {
            transform: scale(0.98);
            box-shadow: 0 3px 8px rgba(224, 46, 36, 0.3);
        }

        .order-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

<header class="app-header">
    <span class="logo-dot">🛒</span>
    <span>S Pay Mall 商城</span>
    <span class="sub">拼着买 更划算</span>
</header>

<main class="page">
    <div class="container">
        <div class="product-info">
            <div class="thumb">
                <img id="skuImage" src="images/sku-keyboard-001.png" alt="同款机械键盘"
                     onerror="this.style.display='none'; document.getElementById('thumbFallback').style.display='flex';">
                <div class="thumb-fallback" id="thumbFallback">⌨️</div>
            </div>
            <div class="product-meta">
                <h2 class="product-title">美女程序员 - 同款机械键盘</h2>
                <div class="tags">
                    <span class="tag">限时秒杀</span>
                    <span class="tag tag-light">包邮</span>
                </div>
                <div class="price-row">
                    <span class="price"><i>¥</i>1.68</span>
                    <span class="price-origin">¥299.00</span>
                    <span class="sold">已售 10万+</span>
                </div>
            </div>
        </div>

        <div class="benefit">
            <span class="benefit-item">支付有礼</span>
            <span class="benefit-item">极速退款</span>
            <span class="benefit-item">假一赔十</span>
        </div>

        <span class="account-info">
            <strong>沙箱测试账号</strong>
            账号：kvhmoj3832@sandbox.com　密码：111111　支付密码：111111
        </span>

        <div class="error-tip" id="errorTip"></div>
    </div>
</main>

<footer class="bottom-bar">
    <button id="orderButton" class="order-button">立即下单「沙箱支付」</button>
</footer>

<script>
    function getCookie(name) {
        let cookieArr = document.cookie.split(";");
        for (let i = 0; i < cookieArr.length; i++) {
            let cookiePair = cookieArr[i].split("=");
            if (name == cookiePair[0].trim()) {
                return decodeURIComponent(cookiePair[1]);
            }
        }
        return null;
    }

    function showError(message) {
        var tip = document.getElementById('errorTip');
        tip.textContent = message;
        tip.style.display = 'block';
    }

    document.getElementById('orderButton').addEventListener('click', function () {
        var orderButton = this;
        var errorTip = document.getElementById('errorTip');
        errorTip.style.display = 'none';

        var userId = getCookie("loginToken");
        if (!userId) {
            window.location.href = "login.html"; // 跳转到登录页
            return;
        }

        var productId = "100010090091";
        var url = 'http://127.0.0.1:8000/api/v1/alipay/create_pay_order';

        var requestBody = {
            userId: userId,
            productId: productId
        };

        orderButton.disabled = true;
        orderButton.textContent = '正在创建订单…';

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody) // 将请求体转换为JSON字符串
        })
            .then(response => response.json()) // 解析JSON格式的响应
            .then(json => {
                if (json.code === "0000") { // 假设成功的code是"0000"
                    var formHtml = json.data; // 获取data字段中的HTML表单字符串
                    // 用 insertAdjacentHTML 追加，避免 innerHTML += 重新序列化整个 body
                    document.body.insertAdjacentHTML('beforeend', formHtml);
                    var payForm = document.forms['punchout_form'] || document.forms[0];
                    if (!payForm) {
                        showError('支付表单创建失败，请稍后重试');
                        orderButton.disabled = false;
                        orderButton.textContent = '立即下单「沙箱支付」';
                        return;
                    }
                    payForm.submit(); // 自动提交表单
                } else {
                    console.error('Error:', json.info); // 输出错误信息
                    showError('下单失败：' + (json.info || '未知错误'));
                    orderButton.disabled = false;
                    orderButton.textContent = '立即下单「沙箱支付」';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('请求失败：' + error.message);
                orderButton.disabled = false;
                orderButton.textContent = '立即下单「沙箱支付」';
            });
    });
</script>

</body>
</html>
