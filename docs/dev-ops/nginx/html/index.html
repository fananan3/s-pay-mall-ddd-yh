<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Pay Mall 商城 - 拼团下单</title>
    <!-- 样式合并自 group-buy-market 首页：common（变量/按钮/顶部栏）+ index（商品/拼团列表/价签栏）+ modal（支付弹窗） -->
    <link rel="stylesheet" href="css/common.css?v=20260929">
    <link rel="stylesheet" href="css/index.css?v=20260929">
    <link rel="stylesheet" href="css/modal.css?v=20260929">
    <!-- 我的订单（列表 / 继续支付 / 退单） -->
    <link rel="stylesheet" href="css/orders.css?v=20261007">
</head>
<body>

<header class="app-header">
    <div class="logo-area">
        <span class="brand-logo">S Pay Mall 商城</span>
    </div>
    <div class="user-actions">
        <span class="user-name" id="userName"></span>
        <span class="logout-btn" id="logoutBtn">退出</span>
    </div>
</header>

<!-- 数据来源提示：接口不可用时才显示 -->
<div class="data-source-tip" id="dataSourceTip" hidden></div>

<!-- 商品轮播 -->
<section class="banner-section">
    <div class="carousel-container">
        <div class="carousel-wrapper" id="carouselWrapper"></div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>
</section>

<!-- 商品标题 + 活动状态 -->
<section class="goods-title-bar">
    <img class="goods-thumb" id="goodsThumb" src="image/sku-13811216-01.png" alt="商品图">
    <div class="goods-title-text">
        <h1 class="goods-name" id="goodsName">《手写MyBatis：渐进式源码实践》</h1>
        <div class="goods-meta">
            <span class="activity-status" id="activityStatus" hidden></span>
            <span class="activity-time" id="activityTime" hidden></span>
        </div>
        <div class="goods-id">商品编号 <span id="goodsIdText">9890001</span></div>
    </div>
</section>

<!-- 优惠信息（直降金额 / 几人团 / 活动状态） -->
<section class="benefit-bar">
    <span class="benefit-tag" id="benefitTag">拼团优惠</span>
    <span class="benefit-text" id="benefitText">正在加载拼团信息…</span>
</section>

<!-- 支付宝沙箱测试账号（付款时用） -->
<div class="sandbox-card">
    <strong>沙箱测试买家账号（跳到支付宝后用它登录付款）</strong>
    账号：<span class="copyable" onclick="copyText('kvhmoj3832@sandbox.com')">kvhmoj3832@sandbox.com</span>（点击复制）
    登录密码：111111　支付密码：111111
</div>

<!-- 进行中的拼团 + 拼团统计 -->
<section class="team-section">
    <div class="team-header">
        <span class="team-header-title">正在拼的团</span>
        <span class="team-header-stat" id="teamStatistic"></span>
    </div>
    <div class="member-list" id="memberList"></div>
</section>

<!-- 我的订单：查询列表 + 继续支付 + 退单 -->
<section class="orders-section" id="ordersSection">
    <div class="orders-header">
        <span class="orders-title">我的订单</span>
        <span class="orders-header-right">
            <span class="orders-count" id="ordersCount"></span>
            <button class="btn btn-ghost btn-small" id="ordersRefreshBtn" type="button">刷新</button>
        </span>
    </div>
    <!-- 加载中 / 空列表 / 接口异常时的提示 -->
    <div class="orders-tip" id="ordersTip">加载中…</div>
    <div class="order-list" id="orderList"></div>
    <div class="orders-footer">
        <button class="btn btn-ghost btn-pill" id="ordersMoreBtn" type="button" hidden>加载更多</button>
        <div class="orders-end" id="ordersEnd" hidden>没有更多订单了</div>
    </div>
</section>

<!-- 按钮为什么是灰的，直接写出来 -->
<div class="buy-hint" id="buyHint" hidden></div>

<!-- 价格 + 下单（吸底，保证下单按钮始终可见） -->
<section class="price-bar">
    <div class="price-box">
        <div class="price-row">
            <span class="price-label">单买价</span>
            <span class="price-strike"><i>￥</i><span id="singlePrice">--</span></span>
        </div>
        <div class="price-row">
            <span class="price-label">拼团价</span>
            <span class="price-sub"><i>￥</i><span id="groupPrice">--</span></span>
            <span class="save-badge" id="saveAmount" hidden></span>
        </div>
    </div>
    <!-- 单独购买：marketType = 0，不透传 teamId / activityId -->
    <button class="btn btn-ghost btn-pill buy-alone" id="singleBuyBtn">单独购买</button>
    <!-- 开团购买：marketType = 1，teamId 为空（后端新建团），带 activityId -->
    <button class="btn btn-primary btn-pill group-buy group-buy-btn" id="groupBuyBtn">开团购买</button>
</section>

<!-- 弹窗挂载节点 -->
<div id="modalContainer"></div>

<script src="js/common.js?v=20260929"></script>
<script src="js/index.js?v=20260929"></script>
<script src="js/pay-modal.js?v=20260929"></script>
<script src="js/orders.js?v=20261007"></script>
</body>
</html>
