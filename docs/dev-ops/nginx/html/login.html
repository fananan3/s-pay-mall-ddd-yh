<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Pay Mall 商城 - 扫码登录</title>
    <style>
        :root {
            --brand: #e02e24;
            --brand-light: #ff5a4e;
            --brand-dark: #c8231a;
            --text: #222222;
            --text-sub: #888888;
            --line: #eeeeee;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(circle at 50% 0%, #ffe9e6 0%, #f4f4f4 55%, #f4f4f4 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 32px 24px 28px;
            text-align: center;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(224, 46, 36, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--brand-light), var(--brand-dark));
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 6px 14px rgba(224, 46, 36, 0.3);
        }

        .login-container h1 {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin: 0 0 20px;
            color: var(--text-sub);
            font-size: 12px;
        }

        /* 二维码区域：红色描边 + 内嵌白底 */
        .qr-code {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid #ffe0dd;
            border-radius: 16px;
            box-shadow: inset 0 0 0 6px #fff8f7;
        }

        /* 四角装饰，模仿扫码框 */
        .qr-code::before,
        .qr-code::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid var(--brand);
        }

        .qr-code::before {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 12px;
        }

        .qr-code::after {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 12px;
        }

        .qr-code img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-loading {
            position: absolute;
            inset: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff;
            border-radius: 12px;
            color: var(--text-sub);
            font-size: 12px;
        }

        .qr-loading .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid #ffe0dd;
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .instructions {
            margin: 0;
            padding: 10px 12px;
            background: #fff8f7;
            border-radius: 12px;
            color: var(--brand);
            font-size: 13px;
            font-weight: 600;
        }

        .instructions.is-error {
            background: #fff1f0;
            color: var(--brand-dark);
        }

        .tips {
            margin: 14px 0 0;
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.7;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 5px;
            border-radius: 50%;
            background: #52c41a;
            vertical-align: middle;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.25;
            }
        }

        @media (max-width: 360px) {
            .qr-code {
                width: 168px;
                height: 168px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-logo">S</div>
    <h1>S Pay Mall 商城登录页</h1>
    <p class="subtitle">扫码即登录，安全更省心</p>

    <div class="qr-code">
        <img id="qr-code-img" alt="微信二维码">
        <div class="qr-loading" id="qrLoading">
            <div class="spinner"></div>
            <span>二维码加载中…</span>
        </div>
    </div>

    <p class="instructions" id="loginTip"><span class="status-dot"></span>请使用微信扫描二维码登录</p>

    <p class="tips">登录成功后会自动跳转到商城首页<br>二维码有效期有限，过期请刷新页面</p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var qrCodeImg = document.getElementById('qr-code-img');
        var qrLoading = document.getElementById('qrLoading');
        var loginTip = document.getElementById('loginTip');

        // 图片加载成功/失败时切换占位层
        qrCodeImg.addEventListener('load', function () {
            qrLoading.style.display = 'none';
        });

        qrCodeImg.addEventListener('error', function () {
            qrLoading.innerHTML = '<span>二维码加载失败，请刷新重试</span>';
        });

        function setTip(html, isError) {
            loginTip.innerHTML = html;
            loginTip.className = isError ? 'instructions is-error' : 'instructions';
        }

        // 获取二维码 ticket
        fetch('/api/v1/login/weixin_qrcode_ticket')
            .then(response => response.json())
            .then(data => {
                if (data.code === "0000") {
                    const ticket = data.data;
                    qrCodeImg.src = `https://mp.weixin.qq.com/cgi-bin/showqrcode?ticket=${ticket}`;

                    // 开始轮询检查登录状态
                    const intervalId = setInterval(() => {
                        checkLoginStatus(ticket, intervalId);
                    }, 3000); // 每3秒检查一次
                } else {
                    console.error('获取二维码 ticket 失败:', data.info);
                    setTip('获取二维码失败：' + (data.info || '未知错误'), true);
                    qrLoading.innerHTML = '<span>二维码获取失败</span>';
                }
            })
            .catch(error => {
                console.error('请求失败:', error);
                setTip('请求失败：' + error.message, true);
                qrLoading.innerHTML = '<span>二维码获取失败</span>';
            });

        function checkLoginStatus(ticket, intervalId) {
            fetch(`/api/v1/login/check_login?ticket=${ticket}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === "0000") {
                        console.info("login success");
                        // 停止轮询
                        clearInterval(intervalId);
                        // 保存登录 token 到 cookie，设置有效期为30天
                        setCookie('loginToken', data.data, 30);
                        setTip('登录成功，正在跳转…');
                        // 在这里可以重定向到登录后的页面
                        window.location.href = 'index.html'; // 假设登录成功后跳转到首页
                    } else {
                        console.info("login wait");
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                });
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }
    });
</script>

</body>
</html>
